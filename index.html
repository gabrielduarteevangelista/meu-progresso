<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Meu Progresso</title>
  <meta name="description" content="Acompanhamento semanal de peso e medidas.">
  <meta name="theme-color" content="#F4F5FA" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0B0C14" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Progresso">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="view" class="view" tabindex="-1"></main>

  <nav class="tabbar" aria-label="Navegação principal">
    <a href="#inicio" data-tab="inicio">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
      <span>Início</span>
    </a>
    <a href="#peso" data-tab="peso">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 6l6 6 4-4 8 8"/><path d="M21 10v6h-6"/></svg>
      <span>Peso</span>
    </a>
    <button type="button" class="fab" id="fab" aria-label="Novo registro">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
    <a href="#medidas" data-tab="medidas">
      <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="7" width="20" height="10" rx="2.5"/><path d="M6.5 7v3.5M10.5 7v5M14.5 7v3.5M18.5 7v5"/></svg>
      <span>Medidas</span>
    </a>
    <a href="#ajustes" data-tab="ajustes">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h9M19 6h1M4 12h3M13 12h7M4 18h11M21 18h-1"/><circle cx="16" cy="6" r="2.5"/><circle cx="10" cy="12" r="2.5"/><circle cx="18" cy="18" r="2.5"/></svg>
      <span>Ajustes</span>
    </a>
  </nav>

  <div id="sheet-root"></div>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <input type="file" id="import-file" accept="application/json,.json" hidden>

  <script src="app.js"></script>
</body>
</html>
